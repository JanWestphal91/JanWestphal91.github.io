backend:
  name: github
  repo: JanWestphal91/JanWestphal91.github.io
  branch: main

# Entwürfe laufen über das Feld "Veröffentlicht" in jedem Beitrag, nicht über
# Branches und Pull Requests. Gespeichert wird also immer direkt auf main;
# ob ein Beitrag auf der Website landet, entscheidet der Schalter.
# (publish_mode: editorial_workflow ist bewusst nicht gesetzt.)

site_url: https://janwestphal.dev

media_folder: "Images"
public_folder: "/Images"

collections:
  - name: site
    label: "Website-Texte"
    files:
      - name: sitetext
        label: "Über mich & Ticker"
        file: "_data/sitetext.json"
        format: json
        description: "Texte für das Über-mich-Popup auf der Startseite und die Laufschrift im Header."
        fields:
          - label: "Über-mich-Popup"
            name: modal
            widget: object
            collapsed: false
            fields:
              - label: "Überschrift (EN)"
                name: heading_en
                widget: string

              - label: "Überschrift (DE)"
                name: heading_de
                widget: string
                required: false

              - label: "Unterzeile (EN)"
                name: subtitle_en
                widget: string

              - label: "Unterzeile (DE)"
                name: subtitle_de
                widget: string
                required: false

              - label: "Portraitfoto"
                name: image
                widget: image
                required: false

              - label: "Portrait Alt-Text (EN)"
                name: image_alt_en
                widget: string
                required: false

              - label: "Portrait Alt-Text (DE)"
                name: image_alt_de
                widget: string
                required: false

              - label: "Absätze"
                name: paragraphs
                widget: list
                label_singular: "Absatz"
                summary: "{{fields.en}}"
                hint: "Reihenfolge per Drag & Drop, Absätze lassen sich hinzufügen und entfernen."
                fields:
                  - { label: "Text (EN)", name: en, widget: text }
                  - { label: "Text (DE)", name: de, widget: text, required: false }

          - label: "Ticker (Laufschrift im Header)"
            name: ticker
            widget: object
            collapsed: false
            fields:
              - label: "Ticker-Text (EN)"
                name: en
                widget: text
                hint: "Eine Zeile, Einträge mit • trennen. Emojis sind erlaubt."

              - label: "Ticker-Text (DE)"
                name: de
                widget: text
                required: false

  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    create: true
    delete: true
    slug: "{{fields.slug}}"
    path: "{{slug}}/index"
    preview_path: "projects/{{slug}}/"
    media_folder: "/Images/projects/{{slug}}"
    public_folder: "/Images/projects/{{slug}}"
    view_filters:
      - label: "Nur Entwürfe"
        field: published
        pattern: false
      - label: "Nur veröffentlichte"
        field: published
        pattern: true
    fields:
      - label: "Veröffentlicht"
        name: published
        widget: boolean
        default: true
        hint: "Aus = Entwurf. Wird gespeichert, erscheint aber nicht auf der Website."

      - label: "Title"
        name: title
        widget: string

      - label: "Slug (URL-ID)"
        name: slug
        widget: string
        hint: "z.B. my-cool-project — wird in der URL verwendet"

      - label: "Kategorie / Jahr"
        name: category
        widget: string
        hint: "z.B. [Game, Code] 2026"

      - label: "Reihenfolge"
        name: order
        widget: number
        default: 10
        hint: "Kleinere Zahl = weiter vorne"

      - label: "Coverbild"
        name: cover_image
        widget: image

      - label: "Coverbild Alt-Text"
        name: cover_image_alt
        widget: string

      - label: "Kurzbeschreibung (EN)"
        name: summary_card
        widget: text
        hint: "Wird auf der Rückseite der Projektkarte angezeigt"

      - label: "Kurzbeschreibung (DE)"
        name: summary_card_de
        widget: text
        required: false

      - label: "Vollständige Beschreibung (EN)"
        name: summary
        widget: markdown
        hint: "Absätze, Links, Listen und Fettung sind möglich. Für einen Link Text markieren und den Link-Button nutzen."

      - label: "Vollständige Beschreibung (DE)"
        name: summary_de
        widget: markdown
        required: false

      - label: "Meta-Tags"
        name: meta
        widget: list
        hint: "z.B. Webgame, Solo-Projekt, Status: Veröffentlicht"

      - label: "Meta-Tags (DE)"
        name: meta_de
        widget: list
        required: false

      - label: "Bilder"
        name: images
        widget: list
        required: false
        fields:
          - { label: "Bild", name: src, widget: image }
          - { label: "Alt-Text", name: alt, widget: string }
          - { label: "Bildunterschrift (EN)", name: caption, widget: string }
          - { label: "Bildunterschrift (DE)", name: caption_de, widget: string, required: false }

      - label: "Embed-Code"
        name: embed
        widget: text
        required: false
        hint: "z.B. itch.io iframe"

      - label: "Datum"
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false

  - name: blog
    label: Blog
    label_singular: Post
    folder: content/blog
    create: true
    delete: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    preview_path: "blog/{{slug}}/"
    media_folder: "/Images/blog/{{slug}}"
    public_folder: "/Images/blog/{{slug}}"
    view_filters:
      - label: "Nur Entwürfe"
        field: published
        pattern: false
      - label: "Nur veröffentlichte"
        field: published
        pattern: true
    fields:
      - label: "Veröffentlicht"
        name: published
        widget: boolean
        default: true
        hint: "Aus = Entwurf. Wird gespeichert, erscheint aber nicht auf der Website."

      - label: "Titel (EN)"
        name: title
        widget: string

      - label: "Titel (DE)"
        name: title_de
        widget: string
        required: false

      - label: "Datum"
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: "Kurzbeschreibung (EN)"
        name: description
        widget: text
        hint: "Wird auf der Blog-Übersicht angezeigt"

      - label: "Kurzbeschreibung (DE)"
        name: description_de
        widget: text
        required: false

      - label: "Titelbild"
        name: cover_image
        widget: image
        required: false

      - label: "Titelbild Alt-Text"
        name: cover_image_alt
        widget: string
        required: false

      - label: "Tags"
        name: tags
        widget: list
        required: false
        hint: "z.B. Game Dev, Design, Werkstatt"

      - label: "Weitere Bilder"
        name: images
        widget: list
        required: false
        fields:
          - { label: "Bild", name: src, widget: image }
          - { label: "Alt-Text", name: alt, widget: string }
          - { label: "Bildunterschrift (EN)", name: caption, widget: string, required: false }
          - { label: "Bildunterschrift (DE)", name: caption_de, widget: string, required: false }

      - label: "Text (EN)"
        name: body
        widget: markdown

      - label: "Text (DE)"
        name: body_de
        widget: markdown
        required: false
