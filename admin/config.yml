- name: projects
  label: Projekte
  label_singular: Projekt
  folder: content/projects
  create: true
  delete: true
  slug: '{{fields.slug}}'
  path: '{{slug}}/index'
  preview_path: projects/{{slug}}/
  media_folder: /Images/projects/{{slug}}
  public_folder: /Images/projects/{{slug}}
  view_filters:
  - label: Nur Entwürfe
    field: published
    pattern: false
  - label: Nur veröffentlichte
    field: published
    pattern: true
  fields:
  - label: Veröffentlicht
    name: published
    widget: boolean
    default: true
    hint: Aus = Entwurf. Wird gespeichert, erscheint aber nicht auf der Website.
  - label: Title
    name: title
    widget: string
  - label: Slug (URL-ID)
    name: slug
    widget: string
    hint: z.B. my-cool-project — wird in der URL verwendet
  - label: Kategorie / Jahr
    name: category
    widget: string
    hint: z.B. [Game, Code] 2026
  - label: Reihenfolge
    name: order
    widget: number
    default: 10
    hint: Kleinere Zahl = weiter vorne
  - label: Auf der Startseite hervorheben
    name: featured
    widget: boolean
    default: false
    required: false
    hint: An = erscheint als große Karte oben auf der Startseite (höchstens zwei Projekte).
  - label: Coverbild
    name: cover_image
    widget: image
  - label: Coverbild Alt-Text
    name: cover_image_alt
    widget: string
  - label: Kurzbeschreibung (EN)
    name: summary_card
    widget: text
    hint: Wird auf der Rückseite der Projektkarte angezeigt
  - label: Kurzbeschreibung (DE)
    name: summary_card_de
    widget: text
    required: false
  - label: Vollständige Beschreibung (EN)
    name: summary
    widget: markdown
    hint: Absätze, Links, Listen und Fettung sind möglich. Für einen Link Text markieren und den Link-Button
      nutzen.
  - label: Vollständige Beschreibung (DE)
    name: summary_de
    widget: markdown
    required: false
  - label: Meta-Tags
    name: meta
    widget: list
    hint: 'z.B. Webgame, Solo-Projekt, Status: Veröffentlicht'
  - label: Meta-Tags (DE)
    name: meta_de
    widget: list
    required: false
  - label: Bilder
    name: images
    widget: list
    required: false
    fields:
    - label: Bild
      name: src
      widget: image
    - label: Alt-Text
      name: alt
      widget: string
    - label: Bildunterschrift (EN)
      name: caption
      widget: string
    - label: Bildunterschrift (DE)
      name: caption_de
      widget: string
      required: false
  - label: Embed-Code
    name: embed
    widget: text
    required: false
    hint: z.B. itch.io iframe
  - label: Datum
    name: date
    widget: datetime
    format: YYYY-MM-DD
    date_format: YYYY-MM-DD
    time_format: false
  icon: deployed_code
- name: blog
  label: Blog
