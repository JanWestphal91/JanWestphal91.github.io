# Sveltia CMS – Konfiguration für janwestphal.dev
#
# Aufbau im CMS:
#   Seiten-Texte    alle festen Texte der Seiten (Deutsch + Englisch)
#   Projekte        Projektseiten
#   Blog            Blogbeiträge
#   Social-Profile  Links zu Instagram, TikTok & Co.
#   Rechtliches     Impressum und Datenschutz
#
# Die Texte liegen als JSON in _data/ und werden beim Build in die Seiten
# eingesetzt. Gespeichert wird immer direkt auf main; ob ein Projekt oder
# Beitrag erscheint, entscheidet der Schalter „Veröffentlicht“.

backend:
  name: github
  repo: JanWestphal91/JanWestphal91.github.io
  branch: main
site_url: https://janwestphal.dev
media_folder: Images
public_folder: /Images
collections:
- name: pages
  label: Seiten-Texte
  description: Alle festen Texte der Website, jeweils auf Deutsch und Englisch.
  icon: article
  files:
